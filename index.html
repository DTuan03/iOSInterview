<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>iOS Interview 19 tuần</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lộ trình 19 tuần ôn phỏng vấn iOS Developer mức 2 năm kinh nghiệm">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <style>
    :root { --theme-color: #0a84ff; --content-max-width: 980px; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section details {
      border: 1px solid #e5e7eb; border-radius: 6px; padding: .5em 1em; margin: .6em 0; background: #fafafa;
    }
    .markdown-section details summary { cursor: pointer; font-weight: 600; color: var(--theme-color); }
    .markdown-section details[open] summary { margin-bottom: .5em; }
    .markdown-section pre > code { font-size: .85rem; }
    .sidebar .app-name-link { font-size: 1.1rem; }
    @media (max-width: 600px) {
      .markdown-section { padding: 20px 16px 40px; }
      .markdown-section table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div id="app">Đang tải…</div>
  <script>
    window.$docsify = {
      name: '📱 iOS Interview 19 tuần',
      repo: 'https://github.com/DTuan03/iOSInterview',
      loadSidebar: true,
      subMaxLevel: 2,
      relativePath: true,
      auto2top: true,
      maxLevel: 3,
      search: {
        placeholder: 'Tìm kiếm…',
        noData: 'Không tìm thấy',
        depth: 3,
        paths: 'auto'
      },
      pagination: {
        previousText: 'Trước',
        nextText: 'Tiếp',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: 'Copy',
        successText: 'Đã copy'
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2.1.1/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-swift.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-ruby.min.js"></script>
</body>
</html>
